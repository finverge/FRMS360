# Ingress load balancer for the control plane.
#
# The gateway is stateless - it verifies a JWT and proxies - so no session affinity is
# needed and any replica can serve any request. That is a property worth stating rather
# than assuming: it is what makes horizontal scaling safe here, and it stops being true
# the moment someone puts server-side session state in the gateway.

upstream gateway_pool {
    least_conn;

    # Compose resolves these to the replicas of the `gateway` service.
    server gateway:8080 max_fails=3 fail_timeout=10s;

    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Requests are already bounded by the per-caller token bucket inside each gateway
    # replica. This limit is different in kind: it is per source address, applied before
    # any application code runs, and it is what stands between the platform and a caller
    # that has not authenticated at all.
    limit_req_zone $binary_remote_addr zone=edge:10m rate=50r/s;
    limit_req zone=edge burst=100 nodelay;

    # A request id is generated here when the client did not supply one, so a single id
    # spans the load balancer, the gateway replica, and every service behind it.
    set $req_id $http_x_request_id;
    if ($req_id = "") { set $req_id $request_id; }

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $req_id;
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # Matched to the gateway's own budget. A proxy that gives up before its upstream does
    # turns a slow answer into a failed one and hides where the time actually went.
    proxy_connect_timeout 3s;
    proxy_send_timeout    30s;
    proxy_read_timeout    30s;

    # Only idempotent requests are retried against another replica. next_upstream applies
    # to the whole method, so leaving POST in would retry writes - the same reason the
    # gateway refuses to retry them.
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;
    proxy_next_upstream_timeout 10s;

    location /health {
        access_log off;
        proxy_pass http://gateway_pool;
    }

    location / {
        proxy_pass http://gateway_pool;
    }
}

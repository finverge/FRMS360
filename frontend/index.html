<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fraud360 Control Plane</title>
    <script>
      // Applied before first paint so there's no flash of the wrong theme. Defaults to
      // dark - this is a fraud-ops control plane read for hours at a stretch, and dark
      // reads as the "serious control room" the console is meant to be; users can flip
      // to light via the header toggle, which persists their choice from then on.
      (function () {
        var stored = localStorage.getItem("fraud360-theme")
        var theme = stored === "light" || stored === "dark" ? stored : "dark"
        if (theme === "dark") document.documentElement.classList.add("dark")
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
